<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#091522">
  <title>Customer Visit Note</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <header class="masthead">
      <a class="wordmark" href="#top" aria-label="Customer Visit Note 홈">
        <span class="wordmark-icon" aria-hidden="true">CN</span>
        <span>FIELD / NOTES</span>
      </a>
      <span class="local-label"><span aria-hidden="true"></span>이 브라우저에 저장</span>
    </header>

    <section class="intro" id="top" aria-labelledby="page-title">
      <p class="eyebrow">CUSTOMER RELATIONS <span>·</span> VISIT LOG</p>
      <h1 id="page-title">Customer Visit Note</h1>
      <p class="intro-copy">현장에서 나눈 대화와 다음 기회를 간결하게 기록하세요.</p>
    </section>

    <div class="content-grid">
      <section class="entry-panel" aria-labelledby="form-heading">
        <div class="section-heading">
          <span class="section-number">01</span>
          <div>
            <p class="section-kicker">NEW ENTRY</p>
            <h2 id="form-heading">방문 기록 작성</h2>
          </div>
        </div>

        <form id="note-form">
          <label class="field" for="alias-input">
            <span>Customer Alias <i>*</i></span>
            <input id="alias-input" name="alias" type="text" placeholder="예: 고객사 A" maxlength="80" required autocomplete="off">
          </label>

          <label class="field" for="visitor-input">
            <span>Visitor Name</span>
            <input id="visitor-input" name="visitor" type="text" placeholder="예: 홍길동" maxlength="80" autocomplete="name">
          </label>

          <label class="field" for="date-input">
            <span>Visit Date <i>*</i></span>
            <input id="date-input" name="date" type="date" required>
          </label>

          <label class="field" for="notes-input">
            <span>Meeting Notes</span>
            <textarea id="notes-input" name="notes" rows="6" maxlength="2000" placeholder="논의 내용, 고객의 관심사, 합의한 다음 단계를 적어 주세요."></textarea>
            <span class="field-hint">실제 고객을 식별할 수 있는 정보는 입력하지 마세요.</span>
          </label>

          <div class="form-actions">
            <button class="button button-quiet" id="clear-button" type="button">Clear</button>
            <button class="button button-primary" type="submit">Save <span aria-hidden="true">↗</span></button>
          </div>
          <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="results-panel" aria-labelledby="results-heading">
        <div class="results-heading">
          <div class="section-heading">
            <span class="section-number">02</span>
            <div>
              <p class="section-kicker">SAVED LOCALLY</p>
              <h2 id="results-heading">저장된 방문 기록</h2>
            </div>
          </div>
          <div class="results-tools">
            <button class="button button-quiet export-button" id="export-button" type="button" disabled>Excel용 CSV 다운로드 <span aria-hidden="true">↓</span></button>
            <span class="result-count" id="result-count">0</span>
          </div>
        </div>
        <div class="result-list" id="result-list" aria-live="polite"></div>
        <p class="privacy-footnote"><span aria-hidden="true">●</span> 기록은 이 기기의 브라우저에만 보관됩니다.</p>
      </section>
    </div>

    <footer class="page-footer"><span>FIELD / NOTES</span><span>PRIVATE WORKSPACE · 01</span></footer>
  </main>
</body>
</html>
