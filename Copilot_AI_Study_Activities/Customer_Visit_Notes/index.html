<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173c35">
  <title>고객 방문 노트</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="주 메뉴">
      <a class="brand" href="#" aria-label="Fieldnote 홈">
        <span class="brand-mark">F</span>
        <span class="brand-name">fieldnote<span class="brand-dot">.</span></span>
      </a>

      <div class="workspace-label">WORKSPACE</div>
      <nav class="primary-nav">
        <a class="nav-link active" href="#visits" aria-current="page"><span class="nav-symbol">▤</span>방문 기록</a>
        <button class="nav-link" id="export-button" type="button"><span class="nav-symbol">⇩</span>기록 내보내기</button>
      </nav>

      <div class="sidebar-bottom">
        <div class="privacy-note"><span class="privacy-dot"></span><span>이 기기에 안전하게 저장됩니다</span></div>
        <div class="user-profile">
          <span class="avatar">나</span>
          <span class="profile-copy"><strong>내 업무 노트</strong><small>개인 워크스페이스</small></span>
          <span class="profile-menu" aria-hidden="true">···</span>
        </div>
      </div>
    </aside>

    <main class="main-content" id="visits">
      <header class="page-header">
        <div>
          <div class="eyebrow"><span class="eyebrow-line"></span>고객 관계 관리</div>
          <h1>방문 기록</h1>
          <p class="page-subtitle">만남의 맥락을 남기고, 다음 대화를 준비하세요.</p>
        </div>
        <button class="button button-primary" id="new-button" type="button"><span class="button-plus">+</span>새 방문 기록</button>
      </header>

      <section class="overview" aria-label="방문 기록 요약">
        <div class="overview-item"><span class="overview-label">전체 기록</span><strong id="total-count">0</strong><span class="overview-unit">건</span></div>
        <div class="overview-divider"></div>
        <div class="overview-item"><span class="overview-label">후속 조치 필요</span><strong class="count-accent" id="follow-up-count">0</strong><span class="overview-unit">건</span></div>
        <div class="overview-note"><span class="overview-spark">✳</span>기록은 이 브라우저에 저장됩니다</div>
      </section>

      <div class="workspace">
        <section class="records-panel" aria-label="방문 기록 목록">
          <div class="records-heading">
            <div><h2>최근 방문</h2><span class="record-total" id="visible-count">0</span></div>
            <button class="text-button" id="sort-button" type="button" aria-label="날짜순 정렬">최신순 <span aria-hidden="true">↕</span></button>
          </div>
          <label class="search-box">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input id="search-input" type="search" placeholder="회사명 또는 담당자 검색" autocomplete="off">
            <kbd>/</kbd>
          </label>
          <div class="filter-tabs" role="group" aria-label="상태별 필터">
            <button class="filter-tab selected" type="button" data-filter="all" aria-pressed="true">전체</button>
            <button class="filter-tab" type="button" data-filter="follow-up" aria-pressed="false">후속 조치</button>
            <button class="filter-tab" type="button" data-filter="done" aria-pressed="false">완료</button>
          </div>
          <div class="record-list" id="record-list" aria-live="polite"></div>
          <div class="list-footer"><span class="footer-mark">F</span><span>좋은 관계는 좋은 기록에서 시작됩니다.</span></div>
        </section>

        <section class="editor-panel" aria-label="방문 기록 편집">
          <div class="editor-topline">
            <div class="breadcrumb"><span>방문 기록</span><span class="breadcrumb-slash">/</span><strong id="editor-mode">기록 상세</strong></div>
            <button class="button button-danger-quiet" id="delete-button" type="button" hidden>삭제</button>
          </div>

          <form id="visit-form">
            <div class="form-heading">
              <span class="form-kicker" id="form-kicker">VISIT NOTE</span>
              <h2 id="form-title">방문 내용을 기록하세요</h2>
              <p>핵심 대화와 다음 할 일을 간단히 정리해 보세요.</p>
            </div>

            <div class="form-grid">
              <label class="field field-wide">
                <span class="field-label">회사명 <i>*</i></span>
                <input id="company-input" name="company" type="text" placeholder="예: 한빛테크" required maxlength="80">
              </label>
              <label class="field">
                <span class="field-label">담당자</span>
                <input id="contact-input" name="contact" type="text" placeholder="이름" maxlength="60">
              </label>
              <label class="field">
                <span class="field-label">방문 날짜 <i>*</i></span>
                <input id="date-input" name="date" type="date" required>
              </label>
              <label class="field">
                <span class="field-label">미팅 유형</span>
                <select id="type-input" name="type">
                  <option>대면 미팅</option>
                  <option>화상 미팅</option>
                  <option>전화 통화</option>
                  <option>현장 방문</option>
                  <option>기타</option>
                </select>
              </label>
              <label class="field">
                <span class="field-label">진행 상태</span>
                <select id="status-input" name="status">
                  <option value="follow-up">후속 조치 필요</option>
                  <option value="done">완료</option>
                </select>
              </label>
              <label class="field field-wide">
                <span class="field-label">참석자</span>
                <input id="attendees-input" name="attendees" type="text" placeholder="이름을 쉼표로 구분해 입력" maxlength="160">
              </label>
              <label class="field field-wide">
                <span class="field-label">미팅 요약</span>
                <textarea id="summary-input" name="summary" rows="4" placeholder="주요 논의 내용과 고객의 반응을 기록하세요." maxlength="2000"></textarea>
              </label>
              <label class="field field-wide">
                <span class="field-label">고객 요청 및 니즈</span>
                <textarea id="needs-input" name="needs" rows="3" placeholder="고객이 필요로 하는 것, 해결해야 할 과제를 적어 주세요." maxlength="1200"></textarea>
              </label>
              <label class="field field-wide next-step-field">
                <span class="field-label"><span class="next-step-icon">↗</span>다음 할 일</span>
                <textarea id="next-step-input" name="nextStep" rows="2" placeholder="예: 견적서 전달하기 · 10월 5일까지" maxlength="800"></textarea>
              </label>
            </div>

            <div class="form-footer">
              <span class="save-status" id="save-status" aria-live="polite">변경 사항은 저장 버튼을 눌러 저장하세요.</span>
              <button class="button button-primary save-button" type="submit"><span aria-hidden="true">✓</span>기록 저장</button>
            </div>
          </form>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
